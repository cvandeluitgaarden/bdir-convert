name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "HTML to BDIR conversion tests"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run tests (exclude Regen)
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh --no-color
